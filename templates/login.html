<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — CLYLAR Network Scanner</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Nunito:wght@900&family=Prompt:wght@500;600;700&family=Sarabun:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        /* ═══════════════════════════════════════════
           RESET & BASE
           ═══════════════════════════════════════════ */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            height: 100%;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #f7f7f8;
            color: #1a1a2e;
            -webkit-font-smoothing: antialiased;
        }

        /* ═══════════════════════════════════════════
           LAYOUT — split screen
           ═══════════════════════════════════════════ */
        .login-wrapper {
            display: flex;
            min-height: 100vh;
        }

        /* ——— LEFT PANEL (form side) ——— */
        .login-left {
            flex: 0 0 480px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 60px 56px;
            background: #ffffff;
            position: relative;
            z-index: 2;
        }

        /* ——— RIGHT PANEL (image side) ——— */
        .login-right {
            flex: 1;
            position: relative;
            overflow: hidden;
            background: #1a1a2e;
        }

        /* Slideshow slides — stacked absolutely */
        .bg-slide {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            filter: brightness(0.88) saturate(1.08);
            opacity: 0;
            transition: opacity 1.2s ease-in-out, transform 8s ease-out;
            transform: scale(1.04);
            will-change: opacity, transform;
        }

        .bg-slide.active {
            opacity: 1;
            transform: scale(1);
        }

        /* Dot indicators */
        .slide-dots {
            position: absolute;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 8px;
            z-index: 3;
        }

        .slide-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.4);
            border: 1.5px solid rgba(255, 255, 255, 0.6);
            cursor: pointer;
            transition: background 0.3s ease, transform 0.3s ease;
        }

        .slide-dot.active {
            background: #f5c518;
            border-color: #f5c518;
            transform: scale(1.3);
        }

        /* Soft gradient overlay to blend the left edge */
        .login-right::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg,
                    rgba(255, 255, 255, 0.12) 0%,
                    transparent 18%,
                    transparent 100%);
            z-index: 2;
            pointer-events: none;
        }

        /* ═══════════════════════════════════════════
           NT LOGO (Official Vector)
           ═══════════════════════════════════════════ */
        .nt-logo {
            margin-bottom: 44px;
        }

        .nt-logo svg {
            height: 52px;
            width: auto;
            display: block;
        }

        /* ═══════════════════════════════════════════
           FORM
           ═══════════════════════════════════════════ */
        .login-heading {
            font-size: 26px;
            font-weight: 700;
            color: #1a1a2e;
            margin-bottom: 6px;
            letter-spacing: -0.5px;
        }

        .login-subheading {
            font-size: 14px;
            color: #8c8c9e;
            margin-bottom: 36px;
            font-weight: 400;
        }

        .form-group {
            margin-bottom: 22px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #4a4a5a;
            margin-bottom: 8px;
            letter-spacing: 0.2px;
        }

        .form-group input {
            width: 100%;
            padding: 13px 16px;
            border: 1.5px solid #e2e2ea;
            border-radius: 10px;
            font-size: 14.5px;
            font-family: inherit;
            color: #1a1a2e;
            background: #fafafc;
            outline: none;
            transition: border-color 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
        }

        .form-group input::placeholder {
            color: #b5b5c3;
        }

        .form-group input:focus {
            border-color: #f5c518;
            background: #ffffff;
            box-shadow: 0 0 0 3.5px rgba(245, 197, 24, 0.12);
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #2d2d3a;
            color: #ffffff;
            font-size: 15px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            letter-spacing: 0.3px;
            transition: background 0.2s ease, transform 0.15s ease, box-shadow 0.2s ease;
            margin-top: 6px;
            position: relative;
            overflow: hidden;
        }

        .login-btn:hover {
            background: #1a1a28;
            transform: translateY(-1px);
            box-shadow: 0 6px 24px rgba(45, 45, 58, 0.25);
        }

        .login-btn:active {
            transform: translateY(0);
            box-shadow: none;
        }

        /* Subtle shimmer on hover */
        .login-btn::after {
            content: '';
            position: absolute;
            top: 0;
            left: -75%;
            width: 50%;
            height: 100%;
            background: linear-gradient(90deg,
                    transparent,
                    rgba(255, 255, 255, 0.07),
                    transparent);
            transition: left 0.6s ease;
        }

        .login-btn:hover::after {
            left: 125%;
        }

        /* ═══════════════════════════════════════════
           FLASH MESSAGE
           ═══════════════════════════════════════════ */
        .alert-error {
            background: #fef2f2;
            border: 1px solid #fecaca;
            color: #b91c1c;
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 13.5px;
            font-weight: 500;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 10px;
            animation: shake 0.4s ease;
        }

        .alert-error::before {
            content: '⚠';
            font-size: 16px;
            flex-shrink: 0;
        }

        @keyframes shake {

            0%,
            100% {
                transform: translateX(0);
            }

            20%,
            60% {
                transform: translateX(-6px);
            }

            40%,
            80% {
                transform: translateX(6px);
            }
        }

        /* ═══════════════════════════════════════════
           FOOTER
           ═══════════════════════════════════════════ */
        .login-footer {
            margin-top: 44px;
            font-size: 12px;
            color: #b5b5c3;
            line-height: 1.6;
        }

        .login-footer span {
            color: #8c8c9e;
        }

        /* ═══════════════════════════════════════════
           RESPONSIVE
           ═══════════════════════════════════════════ */
        @media (max-width: 960px) {
            .login-wrapper {
                flex-direction: column-reverse;
            }

            .login-left {
                flex: none;
                padding: 40px 32px 48px;
            }

            .login-right {
                height: 220px;
                flex: none;
            }

            .nt-logo {
                margin-bottom: 36px;
            }
        }

        @media (max-width: 480px) {
            .login-left {
                padding: 32px 24px 40px;
            }

            .login-heading {
                font-size: 22px;
            }

            .login-right {
                height: 180px;
            }
        }

        /* ═══════════════════════════════════════════
           ANIMATIONS
           ═══════════════════════════════════════════ */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(18px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .login-left>* {
            animation: fadeInUp 0.6s ease forwards;
            opacity: 0;
        }

        .login-left> :nth-child(1) {
            animation-delay: 0.1s;
        }

        .login-left> :nth-child(2) {
            animation-delay: 0.2s;
        }

        .login-left> :nth-child(3) {
            animation-delay: 0.25s;
        }

        .login-left> :nth-child(4) {
            animation-delay: 0.3s;
        }

        .login-left> :nth-child(5) {
            animation-delay: 0.35s;
        }

        .login-left> :nth-child(6) {
            animation-delay: 0.4s;
        }

        .login-left> :nth-child(7) {
            animation-delay: 0.45s;
        }

        .login-left> :nth-child(8) {
            animation-delay: 0.5s;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        /* Initial fade-in for right panel */
        .login-right {
            animation: fadeIn 1s ease 0.3s forwards;
            opacity: 0;
        }

        /* ═══════════════════════════════════════════
           PASSWORD EYE TOGGLE
           ═══════════════════════════════════════════ */
        .password-wrapper {
            position: relative;
        }

        .password-wrapper input {
            padding-right: 44px;
        }

        /* Hide the native browser password-reveal eye icon */
        .password-wrapper input[type="password"]::-ms-reveal,
        .password-wrapper input[type="password"]::-ms-clear {
            display: none;
        }
        .password-wrapper input[type="password"]::-webkit-contacts-auto-fill-button,
        .password-wrapper input[type="password"]::-webkit-credentials-auto-fill-button {
            display: none;
        }

        .password-toggle {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            color: #b5b5c3;
            font-size: 18px;
            padding: 2px;
            line-height: 1;
            transition: color 0.2s ease;
        }

        .password-toggle:hover {
            color: #6b6b7b;
        }
    </style>
</head>

<body>

    <div class="login-wrapper">

        <!-- ═══ LEFT: Logo + Form ═══ -->

            <!-- NT Logo (Official Vector SVG) -->
            <div class="nt-logo">

                        <!-- Bar 3 (Right) -->

                    </g>

                    <g id="nt-letters">
                        <!-- Letter 't' -->
                        <path fill="#55595a" d="M 422.36 127.36 C 428.03 123.86 435.49 123.50 441.45 126.48 C 448.04 129.58 452.69 136.57 452.72 143.89 C 452.80 150.76 452.71 157.62 452.74 164.48 C 461.10 164.56 469.47 164.39 477.82 164.55 C 487.41 165.12 495.13 174.61 493.98 184.10 C 493.36 192.70 485.84 200.05 477.22 200.41 C 469.06 200.66 460.90 200.43 452.74 200.52 C 452.75 226.67 452.74 252.82 452.75 278.98 C 452.41 283.17 455.90 286.89 460.02 287.21 C 463.92 286.87 466.93 284.08 469.17 281.09 C 472.46 276.76 477.39 273.34 482.98 273.20 C 489.07 272.56 494.81 275.94 498.64 280.44 C 502.71 285.29 503.14 292.35 501.32 298.20 C 493.57 317.87 470.77 329.81 450.14 325.41 C 429.66 321.86 413.12 302.82 412.83 281.97 C 412.81 254.82 412.81 227.67 412.83 200.51 C 408.23 200.47 403.36 200.91 399.10 198.83 C 392.38 195.82 388.00 188.40 388.74 181.05 C 389.06 174.15 393.96 167.86 400.40 165.53 C 404.37 164.00 408.69 164.59 412.85 164.48 C 412.80 157.67 412.82 150.85 412.81 144.04 C 412.65 137.27 416.60 130.78 422.36 127.36 Z"/>
                        <!-- Letter 'n' -->
                        <path fill="#55595a" d="M 247.35 165.51 C 253.23 163.58 260.06 164.24 265.20 167.80 C 270.76 171.45 274.19 178.06 273.97 184.71 C 278.73 178.56 284.51 173.03 291.65 169.76 C 304.67 163.77 319.77 163.10 333.62 166.27 C 347.30 169.48 358.92 179.13 365.64 191.32 C 371.06 200.92 373.46 212.05 373.33 223.02 C 373.31 250.00 373.33 276.98 373.33 303.96 C 373.40 309.81 371.01 315.70 366.56 319.56 C 360.70 325.03 351.44 326.21 344.31 322.63 C 337.68 319.49 333.18 312.37 333.20 305.03 C 333.19 280.02 333.18 255.00 333.20 229.98 C 333.17 223.96 331.44 217.90 327.99 212.93 C 322.38 204.53 312.17 199.40 302.05 200.14 C 287.49 200.44 274.48 213.36 274.19 227.94 C 274.15 252.95 274.17 277.96 274.18 302.97 C 274.21 307.65 273.12 312.47 270.33 316.31 C 265.89 322.66 257.55 325.92 249.98 324.27 C 243.06 322.97 237.10 317.64 234.99 310.94 C 233.45 306.46 233.86 301.66 233.82 297.02 C 233.82 261.67 233.83 226.33 233.82 190.99 C 233.82 186.69 233.55 182.25 234.98 178.12 C 236.84 172.29 241.58 167.52 247.35 165.51 Z"/>
                    </g>
                    <!-- Company Text -->
                    <text x="590" y="190"
                          font-family="'Prompt', 'Sarabun', sans-serif"
                          font-size="80"
                          font-weight="800"
                          fill="#363a42">บริษัท โทรคมนาคมแห่งชาติ จำกัด (มหาชน)</text>
                    <text x="590" y="280"
                          font-family="'Inter', 'Arial', sans-serif"
                          font-size="64"
                          font-weight="700"
                          fill="#4d515a">National Telecom Public Company Limited</text>
                </svg>
            </div>

            <!-- Heading -->
            <h1 class="login-heading">Welcome back</h1>
            <p class="login-subheading">Sign in to CLYLAR Network Scanner</p>

            <!-- Flash messages -->
            {% with messages = get_flashed_messages() %}
            {% if messages %}
            <div class="alert-error">{{ messages[0] }}</div>
            {% endif %}
            {% endwith %}

            <!-- Login form -->
            <form method="POST" autocomplete="on">

                <div class="form-group">
                    <label for="login-username">Username</label>
                    <input type="text" id="login-username" name="username" placeholder="Enter your username"
                        autocomplete="username" required autofocus>
                </div>

                <div class="form-group">
                    <label for="login-password">Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="login-password" name="password" placeholder="Enter your password"
                            autocomplete="current-password" required>
                        <button type="button" class="password-toggle" onclick="togglePassword()"
                            aria-label="Toggle password visibility" tabindex="-1">
                            <!-- Eye-off (closed) — default when password is hidden -->
                            <svg id="icon-eye-off" width="20" height="20" viewBox="0 0 24 24" fill="none"
                                stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                                <path
                                    d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94" />
                                <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19" />
                                <path d="M14.12 14.12a3 3 0 1 1-4.24-4.24" />
                                <line x1="1" y1="1" x2="23" y2="23" />
                            </svg>
                            <!-- Eye-open — shown when password is visible -->
                            <svg id="icon-eye-open" width="20" height="20" viewBox="0 0 24 24" fill="none"
                                stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"
                                style="display:none;">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                                <circle cx="12" cy="12" r="3" />
                            </svg>
                        </button>
                    </div>
                </div>

                <button type="submit" class="login-btn" id="login-submit-btn">
                    Sign In
                </button>

            </form>

            <!-- Footer -->
            <div class="login-footer">
                <span>CLYLAR</span> · Network Security Platform<br>
                © 2025 National Telecom Public Company Limited
            </div>

        </div>

        <!-- ═══ RIGHT: Slideshow ═══ -->
        <div class="login-right" id="login-slideshow">
            <img class="bg-slide" src="{{ url_for('static', filename='images/office-team.jpg') }}?v=2"
                alt="National Telecom team collaborating" loading="eager">
            <img class="bg-slide" src="{{ url_for('static', filename='images/nt-building.jpg') }}?v=2"
                alt="National Telecom headquarters building" loading="eager">
            <img class="bg-slide" src="{{ url_for('static', filename='images/nt-city.jpg') }}?v=2"
                alt="National Telecom city network" loading="eager">

            <!-- Dot indicators -->
            <div class="slide-dots" id="slide-dots">
                <div class="slide-dot" data-index="0" onclick="goToSlide(0)"></div>
                <div class="slide-dot" data-index="1" onclick="goToSlide(1)"></div>
                <div class="slide-dot" data-index="2" onclick="goToSlide(2)"></div>
            </div>
        </div>

    </div>

    <script>
        /* ─── Password toggle ─── */
        function togglePassword() {
            const input = document.getElementById('login-password');
            const eyeOff = document.getElementById('icon-eye-off');
            const eyeOpen = document.getElementById('icon-eye-open');
            if (input.type === 'password') {
                input.type = 'text';
                eyeOff.style.display = 'none';
                eyeOpen.style.display = 'block';
            } else {
                input.type = 'password';
                eyeOff.style.display = 'block';
                eyeOpen.style.display = 'none';
            }
        }

        /* ─── Background Slideshow ─── */
        (function () {
            const slides = document.querySelectorAll('.bg-slide');
            const dots = document.querySelectorAll('.slide-dot');
            const total = slides.length;
            let current = Math.floor(Math.random() * total); // random start
            let timer = null;

            function activate(index) {
                // deactivate all
                slides.forEach(function (s) { s.classList.remove('active'); });
                dots.forEach(function (d) { d.classList.remove('active'); });
                // activate chosen
                slides[index].classList.add('active');
                dots[index].classList.add('active');
                current = index;
            }

            function nextSlide() {
                activate((current + 1) % total);
            }

            function startTimer() {
                clearInterval(timer);
                timer = setInterval(nextSlide, 5000);
            }

            // Expose for dot clicks
            window.goToSlide = function (index) {
                activate(index);
                startTimer(); // reset interval on manual click
            };

            // Init
            activate(current);
            startTimer();
        })();
    </script>

</body>

</html>
